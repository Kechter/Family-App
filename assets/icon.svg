<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="rgba(254, 240, 138, 0.3)" stroke-width="4" />

  <!-- House roof -->
  <path d="M 256 100 L 100 230 L 132 230 L 256 128 L 380 230 L 412 230 Z" fill="url(#goldGrad)" />
  
  <!-- Chimney -->
  <path d="M 340 140 L 370 140 L 370 195 L 340 170 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- House body -->
  <path d="M 140 230 L 372 230 L 372 390 C 372 400 364 408 354 408 L 158 408 C 148 408 140 400 140 390 Z" fill="#ffffff" fill-opacity="0.12" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Top star -->
  <polygon points="256,170 262,185 278,186 265,196 270,211 256,201 242,211 247,196 234,186 250,185" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Heart center -->
  <path d="M 256 260 C 256 240, 226 230, 220 255 C 212 288, 256 315, 256 330 C 256 315, 300 288, 292 255 C 286 230, 256 240, 256 260 Z" fill="url(#goldGrad)" />

  <!-- Warm base ground / doorstep -->
  <line x1="120" y1="412" x2="392" y2="412" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
</svg>
