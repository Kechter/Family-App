<!-- Slim Demo Mode Banner (when logged in and in demo mode) -->
<div *ngIf="currentUser && supabaseService.isDemoMode && !isLoginPage" 
     class="bg-brand-accent/15 border-b border-brand-accent/30 text-main text-xs py-1.5 px-4 text-center font-medium flex items-center justify-center gap-2">
  <span class="inline-block w-2 h-2 rounded-full bg-brand-accent animate-pulse"></span>
  <span>Demo-Modus (lokaler Browser-Speicher) – Supabase noch nicht verbunden</span>
</div>

<!-- Authenticated shell (when logged in and not on login/register) -->
<div *ngIf="currentUser && !isLoginPage" class="min-h-screen flex flex-col bg-canvas text-main">
  <!-- Top Header -->
  <header class="app-header shadow-xs">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-3 sm:gap-4">
      <!-- Logo + Brand Name -->
      <a routerLink="/wichteln" class="flex items-center gap-3 group transition-transform active:scale-95 flex-shrink-0">
        <img src="assets/icon.svg" alt="Familien-App Icon" class="w-10 h-10 drop-shadow-sm group-hover:scale-105 transition-transform" />
        <div class="flex flex-col">
          <span class="font-display font-bold text-lg text-main leading-tight tracking-tight group-hover:text-brand-primary transition-colors">Familien-App</span>
          <span class="text-[11px] text-muted font-medium">Gemeinsam durch das Jahr</span>
        </div>
      </a>

      <!-- Desktop Top Navigation Tabs -->
      <nav class="hidden md:flex items-center gap-1.5 bg-surface-alt/75 p-1 rounded-card border border-border/70">
        <a routerLink="/wichteln" 
           routerLinkActive="nav-pill-active" 
           class="nav-pill">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 01-2-2V7a2 2 0 012-2h14a2 2 0 012 2v3a2 2 0 01-2 2m-14 0v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
          </svg>
          Wichteln
        </a>
        <a routerLink="/calendar" 
           routerLinkActive="nav-pill-active" 
           class="nav-pill">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          Kalender
        </a>
        <a routerLink="/profile" 
           routerLinkActive="nav-pill-active" 
           class="nav-pill">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Profil
        </a>
      </nav>

      <!-- Right Actions: Theme Switcher, User Pill & Logout -->
      <div class="flex items-center gap-2 sm:gap-2.5 flex-shrink-0">
        <!-- Compact Design-Charakter Switcher -->
        <app-theme-switcher class="hidden sm:inline-flex"></app-theme-switcher>

        <!-- Current user pill -->
        <a routerLink="/profile" 
           class="flex items-center gap-2 pl-1.5 pr-3 py-1 bg-surface-alt hover:bg-surface rounded-full border border-border transition-colors shadow-xs"
           title="Mein Profil öffnen">
          <app-avatar [name]="currentUser.username" [color]="currentUser.avatar_color" size="sm"></app-avatar>
          <span class="text-sm font-semibold text-main max-w-[100px] sm:max-w-[130px] truncate">{{ currentUser.username }}</span>
          <app-badge *ngIf="currentUser.role === 'admin'" variant="primary" extraClass="text-[10px] py-0.5 px-1.5">Admin</app-badge>
        </a>

        <!-- Sign out button -->
        <app-button variant="ghost" size="sm" (btnClick)="onSignOut()" extraClass="p-2 text-muted hover:text-danger" title="Abmelden">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span class="sr-only">Abmelden</span>
        </app-button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-5xl mx-auto px-4 pt-5 pb-24 md:pb-10 w-full flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Mobile Fixed Bottom Navigation Bar -->
  <nav class="mobile-nav px-2 py-1.5 grid grid-cols-3 items-center shadow-lg">
    <a routerLink="/wichteln" 
       routerLinkActive="mobile-tab-active"
       class="mobile-tab">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 01-2-2V7a2 2 0 012-2h14a2 2 0 012 2v3a2 2 0 01-2 2m-14 0v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
      </svg>
      <span>Wichteln</span>
    </a>

    <a routerLink="/calendar" 
       routerLinkActive="mobile-tab-active"
       class="mobile-tab">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      <span>Kalender</span>
    </a>

    <a routerLink="/profile" 
       routerLinkActive="mobile-tab-active"
       class="mobile-tab">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      <span>Profil</span>
    </a>
  </nav>
</div>

<!-- Non-authenticated or login route view -->
<div *ngIf="!currentUser || isLoginPage" class="min-h-screen bg-canvas text-main">
  <router-outlet></router-outlet>
</div>
