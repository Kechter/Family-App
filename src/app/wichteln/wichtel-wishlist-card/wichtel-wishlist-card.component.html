<section *ngIf="isParticipant">
  <app-card extraClass="space-y-5">
    <div class="flex items-start justify-between gap-4">
      <div class="space-y-1">
        <h2 class="section-title">
          <span>📝</span>
          <span>Mein Wunschzettel & Hinweise</span>
        </h2>
        <p class="text-muted text-sm">
          Dieser Text wird deinem geheimen Wichtel angezeigt. Hilf ihm mit Geschenkideen, Vorlieben, No-Gos oder Kleidergrößen!
        </p>
      </div>
    </div>

    <div class="space-y-3">
      <textarea
        [value]="localNote"
        (input)="localNote = $any($event.target).value"
        rows="4"
        placeholder="z.B. Ich trinke gerne Earl Grey Tee, liebe dicke Wollsocken (Größe 40) und mag keine Schokolade mit Marzipan..."
        class="textarea-field resize-y"
      ></textarea>

      <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
        <div class="text-xs text-muted">
          Automatisch mit deinem Familien-Profil synchronisiert.
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto">
          <app-badge *ngIf="savedSuccess" variant="success" extraClass="animate-fade-in">
            <span>✓</span>
            <span>Wunschzettel gespeichert!</span>
          </app-badge>

          <app-button
            variant="primary"
            [loading]="isSaving"
            (btnClick)="onSave()"
            extraClass="w-full sm:w-auto"
          >
            <span>💾</span>
            <span>{{ isSaving ? 'Speichern...' : 'Wunschzettel speichern' }}</span>
          </app-button>
        </div>
      </div>
    </div>
  </app-card>
</section>
