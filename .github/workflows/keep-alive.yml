name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://yoenyfrwlilcbhklfucr.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvZW55ZnJ3bGlsY2Joa2xmdWNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MzQyMTIsImV4cCI6MjExMDQxMDIxMn0.tDvUZda0OTjkS5DHvaodhLTgYBaxXtZTkHi3EFZCL3Y' }}
        run: |
          echo "Pinging Supabase REST API..."
          curl -sf "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}"
          echo "Ping successful."
